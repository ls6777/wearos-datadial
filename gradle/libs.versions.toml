[versions]
androidGradlePlugin = "9.5.1"
wearWatchface = "1.3.0"
healthServices = "1.1.0"
concurrentFutures = "1.2.0"
protolayout = "1.4.2"
healthConnect = "1.1.0"
playServicesWearable = "19.0.0"
coroutines = "1.9.0"
work = "2.10.0"
activity = "1.9.3"

[libraries]
wear-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearWatchface" }
health-services-client = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
